name: Yayıncı ya da veritabanı gerilemesi
description: Değişen bir yayıncı, CNKI, CARSI ya da WebVPN akışını gizli bilgi paylaşmadan bildirin.
title: "[site] "
labels: ["site-regression"]
body:
  - type: markdown
    attributes:
      value: |
        Kimlik bilgisi, çerez, imzalı URL, WebVPN token'ı, HAR dosyası ya da telif korumalı tam metin yapıştırmayın.
  - type: input
    id: host
    attributes:
      label: Açılış sayfası host'u
      placeholder: onlinelibrary.wiley.com
    validations:
      required: true
  - type: input
    id: doi_prefix
    attributes:
      label: DOI öneki ya da veritabanı
      placeholder: 10.1002 ya da CNKI
    validations:
      required: true
  - type: dropdown
    id: access_mode
    attributes:
      label: Erişim modu
      options:
        - OA/public
        - JLU kampüs ağı
        - JLU kurum girişi/CARSI
        - JLU WebVPN
        - Bilinmiyor
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Maskelenmiş gözlem
      description: HTTP durumunu, içerik türünü, görünen hata metnini ve insan doğrulaması çıkıp çıkmadığını yazın.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: Denenen rotalar
      description: Maskelenmiş `litlib status --attempts <task-id>` çıktısını ve durma koşullarını özetleyin.
    validations:
      required: true
  - type: input
    id: tested_at
    attributes:
      label: Test tarihi
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: checkboxes
    id: compliance
    attributes:
      label: Uyum onayı
      options:
        - label: Kendi yetkili erişimimi kullandım; CAPTCHA, ödeme duvarı ya da hız sınırlarını aşmadım.
          required: true
