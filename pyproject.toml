[project]
name = "litlib"
version = "0.3.0"
description = "Agent-ready literature workflow for OA and authorized Jilin University access"
readme = "README.md"
license = "MIT"
authors = [{ name = "LitLib contributors" }]
requires-python = ">=3.11,<3.14"
keywords = ["zotero", "mcp", "literature", "jilin-university", "open-access"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "tenacity>=9.0",
    "platformdirs>=4.3",
    "pypdf>=5,<7",
    "mcp>=2.0,<3",
    "websockets>=14.0",
]

[project.urls]
Homepage = "https://github.com/ganpingzhu904-dev/jlu-literature-agent-mcp"
Documentation = "https://github.com/ganpingzhu904-dev/jlu-literature-agent-mcp#readme"
Issues = "https://github.com/ganpingzhu904-dev/jlu-literature-agent-mcp/issues"
Source = "https://github.com/ganpingzhu904-dev/jlu-literature-agent-mcp"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "reportlab>=4.2",
    "ruff>=0.12",
]

[project.scripts]
litlib = "litlib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/litlib"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
